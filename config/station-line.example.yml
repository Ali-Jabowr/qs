# A line station over saved footage, one verdict per cup:
#   qs station --config this --replay DIR
#   qs score-line --config this --footage DIR --labels POSITION=PATH
#
# inspector.line's limits are starting values, UNMEASURED on real footage: they have only been
# tried on frames drawn by the tests. Real accuracy comes from `qs score-line`.
version: 1
station_id: line-replay
product: mochi-<flavour>-v1

# A cup trigger fires once per cup seen crossing the zone (ADR-0028); `key` is unused.
trigger:   { type: cup, key: space }
camera:
  type: replay
  device: none
  width: 1920
  height: 1080
  format: MJPG
  power_line_hz: 50
  exposure_us: 10000
  gain: 0
  wb_kelvin: 4500
  focus: 30
  capture_timeout_ms: 500

lighting:
  geometry: G2
  # No grey card is in view on the line yet, so its lighting check is off. Only a line station
  # may do this; it means a drift in lighting goes unnoticed. The card returns with the mount.
  reference_patch: null
  # Optional, line only. true: the station brings its own constant-current DC light with no PWM,
  # so mains flicker cannot band the picture and exposure_us may be any value at 50 Hz
  # (ADR-0030). Left out, exposure_us must be a multiple of 10000 at 50 Hz.
  # own_dc_light: true

inspector:
  type: line
  checks: [empty_cup]
  line:
    zone:           [360, 0, 1200, 1080]   # x, y, w, h: a cup is judged only if all of it is inside
    rim_size_px:    [500, 500]             # PLACEHOLDER: the rim's [minor, major] full axes measured
                                           # on the mount; a rim is accepted within ±5% of each
    blob_share_min: 0.30                   # below this share of the cup's middle, the cup is empty
    direction:      right                  # the way the chain moves in the picture: set it per footage
    fps:            30                     # the rate the footage was shot at; the file's own rate is ignored
  # The keys below are required of every inspector. A line inspector does not use them, so they
  # hold placeholders: no model and no calibration stand behind this file.
  localize:  { roi: [360, 0, 1200, 1080], threshold: 70, min_area_px: 20000, border_margin_px: 10 }
  mask_dilate_px: 12
  model:     patchcore-none-v0-000000000000
  backend:   torch-cpu

threshold:
  id:     line-uncalibrated
  value:  1.0
  policy: none
  set_on: { model: patchcore-none-v0-000000000000, backend: torch-cpu, calib_units: 0, localize_threshold: 70, mask_dilate_px: 12 }
  geometry:
    area_px:        [1, 2]
    axis_ratio_min: 0.01
    solidity_min:   0.01

display:
  labels: { pass: ГОДЕН, defect: БРАК, no_verdict: НЕТ РЕШЕНИЯ }
  font:   assets/DejaVuSans.ttf
  # ГОДЕН leaves the screen after this many seconds, shorter than the gap between cups at
  # 40–60 cups/min, so it never stands for a later cup. БРАК and НЕТ РЕШЕНИЯ stay.
  pass_expiry_s: 1.0
  # The line never asks anyone to place an item or press a key.
  ready_line: ГОТОВ
  placement_line: стаканчик не проверен

evidence:  { root: evidence/, retention_days: 400 }
latency:   { budget_ms: 1000, breach_action: record_and_continue }

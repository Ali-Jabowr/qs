# QS — single source of truth for project state.
#
# NOTHING about status, dates, progress or gates is hand-written anywhere else.
# STATUS.md, reports/status/*.md and docs/diagrams/timeline.mmd are GENERATED from
# this file by `python3 tools/render.py`. Edit here, then re-render, then commit both.
#
# status values ..... not_started | in_progress | blocked | done | dropped
# task status ....... todo | doing | done | blocked | dropped
# gate status ....... pending | passed | failed | retired
# question status ... open | answered | dropped
#
# Language policy (2026-09-17): engineering docs, code and commits in English.
# Anything that reaches the supervisor or the client is Russian, so every field
# that surfaces in the Russian report carries a *_ru twin. The validator fails
# the build if one is missing.
#
# Rule: a task may only be `done` if it has an `evidence:` value — a path, a
# commit hash, or a filename. The validator fails the build otherwise.

meta:
  name: QS
  title_en: Automated visual quality inspection for a food production line
  title_ru: Автоматический визуальный контроль качества на пищевой линии
  owner: Ali
  owner_ru: Али
  location: Volgograd
  location_ru: Волгоград
  repo: /home/marxel/PROJECTS/QS
  updated: 2026-09-22
  # GitHub is the primary board from 2026-09-22. This file stays the state file and is
  # kept in sync with it; the duplication is accepted. Each migrated question and risk
  # carries its issue number as `issue:`.
  github:
    repo: Ali-Jabowr/qs
    milestone: 1                 # "Bench MVP (21–27.09)"
    tracking_issue: 26           # "Bench MVP — tracking"
    lock_test_issue: 25          # S2.3, ready-for-human
    branch: mvp/bench            # all work from P05b on; Ali merges one PR to master
    primary_board_from: 2026-09-22
    note_en: GitHub is the primary board from 2026-09-22; project.yml is kept in sync.

client:
  label_en: Food producer, Volgograd (one client)
  label_ru: Пищевое производство, Волгоград (один заказчик)
  commercial_status_en: Verbal intent to pay. No signed contract, no money moved.
  commercial_status_ru: Устное намерение оплатить. Договор не подписан, оплаты не было.
  acceptance_criterion_en: "up to 95% (Q28, client verbatim)"
  acceptance_criterion_ru: "до 95% (вопрос 28, дословно со слов заказчика)"
  commercial_model_en: hardware + updatable SaaS + annual calibration, priced by us, no competing bid
  commercial_model_ru: оборудование + обновляемое ПО по подписке + ежегодная калибровка, цену назначаем мы, конкурирующих предложений нет
  timeline_demanded_en: ASAP (Q27)
  timeline_demanded_ru: как можно скорее (вопрос 27)

tracks:
  - id: appearance
    name_en: Appearance station
    name_ru: Станция контроля внешнего вида
    role_en: The R&D. What the client asked for. Gated on data from their line.
    role_ru: >
      Исследовательская часть. Именно это заказчик и просил. Зависит от данных
      с его линии, которых пока нет.
  - id: marking
    name_en: Marking station
    name_ru: Станция контроля маркировки
    role_en: >
      The product. Deterministic, no training data, proven pain (a batch was returned),
      identical at every future customer. First thing that ships.
    role_ru: >
      Продуктовая часть. Детерминированные алгоритмы, обучающие данные не нужны,
      боль подтверждена (партия была возвращена из-за маркировки), решение одинаково
      для любого следующего заказчика. Внедряется первым.
  - id: engineering
    name_en: Engineering foundation
    name_ru: Инженерная основа
    role_en: >
      Contracts, evidence store, evaluation harness, docs. Shared by both stations
      and written once. Unblocked by anything the factory has or has not told us.
    role_ru: >
      Интерфейсы, хранилище доказательств, стенд оценки качества, документация.
      Общая часть для обеих станций, пишется один раз. Не зависит от того, что
      производство уже сообщило или ещё нет.


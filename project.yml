        text_en: The returned-batch story in their own words
        text_ru: История возврата партии их собственными словами
        status: todo
        evidence: null

# --------------------------------------------------------------------------------
# GATES — go / no-go. Definitions live in docs, status lives here.
# --------------------------------------------------------------------------------

gates:
  - id: A
    name_en: Bench detection gate
    name_ru: Рубеж обнаружения на стенде
    due: 2026-10-13
    status: pending
    blocks: [S4, S5]
    definition_ref: docs/14-eval-protocol.md
    statement_en: >
      On the flat product, under the lighting geometry selected on calibration data, with
      the threshold set to a 5% false-alarm target on 30 calibration units: dent recall at
      or above 90% on 30 held-out dented UNITS (at least 27 of 30), whose 95% one-sided
      lower bound therefore clears 75%; false-alarm rate on 40 held-out good units at or
      below 10% as a point estimate, reported with its upper bound; and the whole result
      regenerated from the frozen golden set by one command.
    statement_ru: >
      На плоском изделии, при схеме освещения, выбранной по калибровочной выборке, и пороге,
      установленном на целевую долю ложных срабатываний 5% по 30 калибровочным изделиям:
      полнота обнаружения вмятин не ниже 90% на 30 отложенных повреждённых ИЗДЕЛИЯХ
      (не менее 27 из 30), что даёт нижнюю одностороннюю 95%-ю границу выше 75%; доля ложных
      срабатываний на 40 отложенных годных изделиях не выше 10% как точечная оценка, с
      указанием верхней границы; и весь результат воспроизводится из замороженного эталонного
      набора одной командой.
    on_fail_en: >
      The problem is the lighting, not the model. Return to S2 and re-shoot. Do not retrain,
      do not tune hyperparameters, do not add features.
    on_fail_ru: >
      Проблема в освещении, а не в модели. Вернуться к этапу S2 и переснять. Не переобучать,
      не подбирать гиперпараметры, не добавлять функциональность.
    supersedes_en: >
      The 2026-09-02 formulation (90% of dents at 5% false alarms, on 5 dents and 10 good
      units) was not measurable: 5 of 5 dents caught is consistent with a true catch rate of
      54.9%, and a 5% false-alarm rate cannot be resolved at all on 10 units. See ADR-0005.

  - id: B
    name_en: Latency gate
    name_ru: Рубеж быстродействия
    due: 2026-10-13
    status: pending
    blocks: [S4]
    definition_ref: docs/10-architecture.md
    statement_en: >
      End-to-end trigger-to-verdict at or under 700 ms at the 95th percentile, measured
      on CPU as the Intel N100 proxy, with persistence off the critical path.
    statement_ru: >
      Полный цикл от срабатывания до решения не более 700 мс по 95-му процентилю,
      измеренный на центральном процессоре как приближении к Intel N100, при этом
      запись в хранилище вынесена из критического пути.

  - id: C
    name_en: Hardware spend gate
    name_ru: Рубеж закупки оборудования
    due: null
    status: pending
    blocks: []
    statement_en: >
      No hardware is purchased beyond groceries until Gate A has passed, AND the site visit
      has produced video and defective samples, AND the metrology question (OQ-1) is answered.
    statement_ru: >
      Никакое оборудование, кроме учебных продуктов, не закупается, пока не пройден
      рубеж A, И выезд на производство не дал видео и бракованные образцы, И не получен
      ответ на вопрос о метрологии (OQ-1).

# --------------------------------------------------------------------------------
# OPEN QUESTIONS — each blocks something concrete. `owner` says who can answer.
# --------------------------------------------------------------------------------

open_questions:
  - id: OQ-1
    owner: client
    status: open
    asked_on: null
    text_en: Millimetres with a stated tolerance, or pass/fail against a golden reference?
    text_ru: Нужны ли вам миллиметры с допуском, или достаточно «годен / не годен» по эталонному образцу?
    blocks_en: The entire camera and hardware budget. Do not spec a camera until this is answered.
    blocks_ru: Весь бюджет на камеру и оборудование. До ответа камеру не выбирать.

  - id: OQ-2
    owner: client
    status: open
    asked_on: null
    text_en: Does product move continuously at the inspection point, or stop and index?
    text_ru: Продукт в точке контроля движется непрерывно или останавливается / индексируется?
    blocks_en: Shutter type. Continuous motion forces a global shutter, a strobe and a hardware trigger.
    blocks_ru: Тип затвора. Непрерывное движение требует глобального затвора, импульсного света и аппаратного запуска.

  - id: OQ-3
    owner: client
    status: open
    asked_on: null
    text_en: What is the product height, does it vary, and must height itself be checked?
    text_ru: Какая высота продукта на этой линии, меняется ли она, и нужно ли контролировать высоту?
    blocks_en: One camera or two. A top camera cannot see height at all.
    blocks_ru: Одна камера или две. Камера сверху высоту не видит в принципе.

  - id: OQ-4
    owner: client
    status: open
    asked_on: null
    text_en: What is meant by "foreign objects"? What is already on the line — metal detector, X-ray?
    text_ru: Что вы понимаете под «посторонними предметами»? Что уже стоит на линии — металлодетектор, рентген?
    blocks_en: Liability scope. Never accept foreign-object detection inside a 95% acceptance clause.
    blocks_ru: Границы ответственности. Не принимать обнаружение посторонних предметов внутрь условия о 95%.

  - id: OQ-5
    owner: client
    status: open
    asked_on: null
    text_en: Units per shift, shifts per day, and what one return costs in rubles?
    text_ru: Сколько единиц за смену, сколько смен? Во сколько рублей обходится один возврат?
    blocks_en: Pricing and the entire business case. "2% per day" of an unknown base is not a number.
    blocks_ru: Ценообразование и всё экономическое обоснование. «2% в день» от неизвестной базы — это не число.

  - id: OQ-6
    owner: client
    status: open
    asked_on: null
    text_en: Who signs off food safety, and what must they approve to allow equipment over open product?
    text_ru: Кто у вас отвечает за пищевую безопасность, и что он должен одобрить, чтобы разрешить установку оборудования над открытым продуктом?
    blocks_en: This person can veto the installation after the hardware has been bought.
    blocks_ru: Этот человек может запретить установку уже после закупки оборудования.

  - id: OQ-7
    owner: us
    status: open
    text_en: Which Anomalib models are licence-clean for a commercial deliverable?
    text_ru: Какие модели Anomalib юридически чисты для коммерческой поставки?
    blocks_en: Model selection for anything that ships. Anomalib is Apache-2.0; per-model terms differ.
    blocks_ru: Выбор модели для поставки. Сам Anomalib под Apache-2.0, но условия отдельных моделей различаются.

# --------------------------------------------------------------------------------
# RISKS
# --------------------------------------------------------------------------------

risks:
  - id: R1
    severity: high
    text_en: No physical evidence exists — no video, no photographs, no defective samples.
    text_ru: Физических свидетельств нет — ни видео, ни фотографий, ни бракованных образцов.
    signal_en: Still true. Identified 2026-09-02, unchanged 15 days later.
    signal_ru: Положение не изменилось. Зафиксировано 02.09.2026, спустя 15 дней без движения.
    response_en: Stage S5. Nothing about hardware or price can be settled without it.
    response_ru: Этап S5. Без этого невозможно определить ни оборудование, ни цену.
  - id: R2
    severity: high
    text_en: Natural food variation swamps the defect signal, producing constant false alarms.
    text_ru: Естественная изменчивость пищевого продукта перекрывает признак дефекта, вызывая постоянные ложные срабатывания.
    signal_en: A high false-alarm rate on good units at S3.
    signal_ru: Высокая доля ложных срабатываний на годных изделиях на этапе S3.
    response_en: More training data, tighter lighting control, or narrow the scope to one SKU. The central risk of the appearance station.
    response_ru: Больше обучающих данных, жёстче контроль освещения или сужение до одной позиции ассортимента. Главный риск станции внешнего вида.
  - id: R3
    severity: high
    text_en: "\"Foreign objects\" inside a 95% acceptance clause promises safety-critical detection that optics cannot deliver."
    text_ru: "«Посторонние предметы» внутри условия о 95% обещают критичное для безопасности обнаружение, которое оптика обеспечить не может."
    signal_en: Present in the defect list and the acceptance criterion simultaneously.
    signal_ru: Присутствует одновременно в перечне дефектов и в критерии приёмки.
    response_en: "Scope it out in writing — surface-visible contrasting objects, best effort, not a substitute for metal detection or X-ray."
    response_ru: "Письменно ограничить формулировкой — видимые на поверхности контрастные предметы, по мере возможности, не заменяет металлодетектор или рентген."
  - id: R4
    severity: medium
    text_en: Camera automatic settings destroy the dataset by re-exposing for the defect.
    text_ru: Автоматические настройки камеры портят датасет, подстраивая экспозицию под дефект.
    signal_en: Images inconsistent between sessions.
    signal_ru: Снимки несогласованы между сессиями съёмки.
    response_en: Lock exposure, white balance and focus. The most common failure in this whole plan. The reference patch detects it.
    response_ru: Зафиксировать выдержку, баланс белого и фокус. Самая частая ошибка во всём плане. Эталонная пластина её выявляет.
  - id: R5
    severity: medium
    text_en: PatchCore is too slow for one unit per second on an Intel N100.
    text_ru: PatchCore слишком медленный для одного изделия в секунду на Intel N100.
    signal_en: Gate B fails at S3.
    signal_ru: Рубеж B не пройден на этапе S3.
    response_en: A smaller coreset, lower input resolution, or switch to PaDiM or FastFlow.
    response_ru: Уменьшить опорное множество, снизить разрешение входа или перейти на PaDiM либо FastFlow.
  - id: R6
    severity: medium
    text_en: Real factory defects are subtler than our deliberate damage.
    text_ru: Реальные производственные дефекты тоньше, чем наши намеренные повреждения.
    signal_en: Only visible at S6.
    signal_ru: Проявится только на этапе S6.
    response_en: This is why defective samples matter more than any questionnaire answer.
    response_ru: Именно поэтому бракованные образцы важнее любого ответа в анкете.
  - id: R7
    severity: medium
    text_en: The food-safety officer vetoes the installation after hardware has been bought.
    text_ru: Ответственный за пищевую безопасность запрещает установку уже после закупки оборудования.
    signal_en: OQ-6 unanswered.
    signal_ru: Вопрос OQ-6 остаётся без ответа.
    response_en: Gate C. Ask before spending.
    response_ru: Рубеж C. Спросить до того, как тратить.
  - id: R8
    severity: low
    text_en: Something trained on MVTec AD ends up in a deliverable — the licence is non-commercial.
    text_ru: Что-то обученное на MVTec AD попадает в поставку — лицензия запрещает коммерческое использование.
    signal_en: —
    signal_ru: —
    response_en: MVTec is S1 validation only. It is never trained into anything that ships.
    response_ru: MVTec используется только для проверки окружения на этапе S1 и никогда не обучается в поставляемое решение.
